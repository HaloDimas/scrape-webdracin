<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- SEO Meta Tags -->
    <title>DramaStream - Watch Free Asian Dramas Online</title>
    <meta name="description" content="Watch free Asian dramas online. Stream Korean, Chinese, Japanese, and Thai dramas with no login required. Mobile-friendly drama streaming." />
    <meta name="keywords" content="drama streaming, korean drama, asian drama, free drama, watch drama online, kdrama, cdrama" />
    <meta name="author" content="DramaStream" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="DramaStream - Free Drama Streaming" />
    <meta property="og:description" content="Watch free Asian dramas online with no login required." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DramaStream" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DramaStream - Free Drama Streaming" />
    <meta name="twitter:description" content="Watch free Asian dramas online with no login required." />
    
    <!-- Canonical -->
    <link rel="canonical" href="https://dramastream.app" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    
    <!-- Preconnect to APIs + cover hosts (covers load direct for speed) -->
    <link rel="preconnect" href="https://dramabox.sansekai.my.id" />
    <link rel="preconnect" href="https://webdracin.com" />
    <link rel="dns-prefetch" href="https://webdracin.com" />
    
    <!-- Google AdSense -->
    <meta name="google-adsense-account" content="ca-pub-1973701936644438">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1973701936644438" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "DramaStream",
      "description": "Watch free Asian dramas online",
      "url": "https://dramastream.app",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://dramastream.app/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </body>
</html>
